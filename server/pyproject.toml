[project]
name = "voice-query-server"
version = "1.0.0"
description = "VoiceQuery Intelligence Server powered by Azure AI Foundry and Cosmos DB"
requires-python = ">=3.13"
dependencies = [
    "azure-ai-inference>=1.0.0b9",
    "azure-core>=1.30.0",
    "azure-cosmos>=4.17.0",
    "azure-storage-blob>=12.23.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pipecat-ai[azure,websocket]>=1.14.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "SIM",
    "S",
    "RUF",
]
ignore = [
    "E501",  # Line length
    "S101",  # Use of assert
    "S104",  # Possible binding to 0.0.0.0
]

