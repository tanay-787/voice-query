[project]
name = "voice-query-server"
version = "1.0.0"
description = "VoiceQuery Intelligence Server powered by Azure AI Foundry and Cosmos DB"
requires-python = ">=3.13"
dependencies = [
    "azure-ai-inference>=1.0.0b9",
    "azure-core>=1.30.0",
    "azure-cosmos>=4.17.0",
    "azure-storage-blob>=12.23.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false
